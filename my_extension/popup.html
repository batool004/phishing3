<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>CyberGuard Extension</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 380px;
  font-family: 'Poppins', 'Segoe UI', sans-serif;

  /* 🖼️ الخلفية */
  background-image: url("images/background.png");
  background-size: cover;
  background-position: center;

  padding: 15px;
  position: relative;
}

/* طبقة تغميق */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 0;
}

.container {
  position: relative;
  z-index: 2;

  background: rgba(10, 15, 42, 0.85);
  backdrop-filter: blur(12px);
  border-radius: 25px;
  padding: 20px;

  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.2);
}

.header {
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  position: relative;
}

/* 🇯🇴 العلم */
.jordan-flag {
  position: absolute;
  top: -15px;
  right: -15px;
  width: 60px;
  height: 38px;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

.jordan-flag .stripe {
  height: 33.33%;
  width: 100%;
}

.black { background: #000; }
.white { background: #fff; }
.green { background: #007a3d; }

.jordan-flag .triangle {
  position: absolute;
  top: 0;
  left: 0;
  border-top: 19px solid transparent;
  border-bottom: 19px solid transparent;
  border-left: 30px solid #ce1126;
}

.jordan-flag .star {
  position: absolute;
  top: 50%;
  left: 10px;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 11px;
  font-weight: bold;
}

/* العنوان */
.header h2 {
  font-size: 1.3rem;
  background: linear-gradient(135deg, #ffffff, #a8b2ff, #4facfe);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.header p {
  font-size: 0.75rem;
  color: rgba(255,255,255,0.7);
}

/* باقي التصميم نفس ما كان */
.current-tab {
  background: rgba(255,255,255,0.08);
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 12px;
  font-size: 0.8rem;
  word-break: break-all;
  color: white;
}

.current-tab strong {
  color: #4facfe;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  color: white;
  margin-bottom: 10px;
  font-family: monospace;
}

button {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #4facfe, #0062e6);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.result {
  margin-top: 15px;
  padding: 12px;
  border-radius: 12px;
  text-align: center;
  color: white;
}

.result.safe { background: linear-gradient(135deg, #00d4aa, #00b894); }
.result.phishing { background: linear-gradient(135deg, #ff4757, #c0392b); }
.result.medium { background: linear-gradient(135deg, #ffa502, #ff7f50); }

.stats {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.7);
}

.settings {
  text-align: center;
  margin-top: 10px;
}

.settings a {
  color: #4facfe;
  font-size: 0.7rem;
  text-decoration: none;
}
</style>
</head>

<body>
<div class="container">

  <div class="header">

    <!-- 🇯🇴 العلم -->
    <div class="jordan-flag">
      <div class="stripe black"></div>
      <div class="stripe white"></div>
      <div class="stripe green"></div>
      <div class="triangle"></div>
      <div class="star">★</div>
    </div>

    <h2>🛡️ CyberGuard</h2>
    <p>AI URL Protection</p>
  </div>

  <div class="current-tab">
    <strong>📍 Current URL:</strong><br>
    <span id="current-url">Loading...</span>
  </div>

  <input type="text" id="url-input" placeholder="https://example.com">

  <button id="check-btn">🔍 Analyze URL</button>

  <div id="result" class="result" style="display:none;"></div>

  <div class="stats">
    <span>⚡ Real-time</span>
    <span>🎯 AI Detection</span>
    <span>🛡️ Secure</span>
  </div>

  <div class="settings">
    <a href="#">⚙️ Settings</a>
  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
